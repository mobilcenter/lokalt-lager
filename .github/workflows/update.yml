name: Uppdatera lokalt lager

on:
  schedule:
    # 19:00 svensk sommartid (18:00 vintertid). GitHub kan försena schemalagda
    # körningar flera timmar, så de måste starta i god tid innan Merchant Center
    # hämtar filen kl 00:00.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py
      - name: Spara ändringar
        run: |
          git config user.name "lokalt-lager-bot"
          git config user.email "actions@users.noreply.github.com"
          # Tidsstämpeln ger en commit varje dag, annars stänger GitHub av
          # schemat efter 60 dagar utan aktivitet i repot.
          date -u +%FT%TZ > senast-uppdaterad.txt
          git add lokalt-lager.tsv senast-uppdaterad.txt
          git commit -m "Uppdatera lokalt lager $(date +%F)"
          git push
