name: Uppdatera lokalt lager

on:
  schedule:
    - cron: "0 20 * * *" # 22:00 svensk sommartid, innan Merchant Center hämtar kl 00:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py
      - name: Spara ändringar
        run: |
          git config user.name "lokalt-lager-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lokalt-lager.tsv
          git diff --cached --quiet || git commit -m "Uppdatera lokalt lager $(date +%F)"
          git push
